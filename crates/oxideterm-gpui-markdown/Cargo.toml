[lints]
workspace = true

[package]
name = "oxideterm-gpui-markdown"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
ego-tree = "0.11"
html5gum = "0.8.3"
unicode-linebreak = "0.1.5"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
gpui.workspace = true
url.workspace = true
oxideterm-theme = { path = "../oxideterm-theme" }
oxideterm-gpui-ui = { path = "../oxideterm-gpui-ui" }
pulldown-cmark = "0.12"
ratex-layout = "0.1.8"
ratex-parser = "0.1.8"
ratex-svg = { version = "0.1.8", features = ["embed-fonts"] }
ratex-types = "0.1.8"
scraper = { version = "0.27", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
