[lints]
workspace = true

[package]
name = "oxideterm-gpui-host-tools"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
chrono.workspace = true
gpui.workspace = true
oxideterm-connection-monitor = { path = "../oxideterm-connection-monitor" }
oxideterm-editor-core = { path = "../oxideterm-editor-core" }
oxideterm-gpui-ui = { path = "../oxideterm-gpui-ui" }
oxideterm-i18n = { path = "../oxideterm-i18n" }
oxideterm-settings = { path = "../oxideterm-settings" }
oxideterm-theme = { path = "../oxideterm-theme" }
oxideterm-topology = { path = "../oxideterm-topology" }
oxideterm-workspace = { path = "../oxideterm-workspace" }
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
oxideterm-audit = { path = "../oxideterm-audit" }
oxideterm-ssh = { path = "../oxideterm-ssh" }
tokio.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
futures-util.workspace = true
web-time.workspace = true

[dev-dependencies]
base64.workspace = true
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3.23"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
