[lints]
workspace = true

[package]
name = "oxideterm-local-files"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
md5 = "0.7"
sha2.workspace = true
web-time.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
dirs.workspace = true
oxideterm-atomic-file = { path = "../oxideterm-atomic-file" }
oxideterm-audit = { path = "../oxideterm-audit" }
sysinfo.workspace = true
walkdir = "2"
zip.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# FileOptions with zip's native time feature calls SystemTime::now on wasm.
zip = { version = "2.0", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile = "3.23"
