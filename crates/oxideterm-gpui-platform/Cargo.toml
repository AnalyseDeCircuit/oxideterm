[lints]
workspace = true

[package]
name = "oxideterm-gpui-platform"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
gpui.workspace = true
oxideterm-render-policy = { path = "../oxideterm-render-policy" }
oxideterm-theme = { path = "../oxideterm-theme" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
anyhow.workspace = true
futures.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zeroize.workspace = true
# GPUI-CE otherwise installs a no-op text system on macOS.
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { package = "gpui-pre-web", version = "=0.3.12", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
objc2-app-kit = { version = "0.3.2", features = ["NSResponder", "NSView", "NSWindow"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
raw-window-handle.workspace = true
system-configuration = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
raw-window-handle.workspace = true
x11-dl = "2.21.0"
