[package]
name = "oxideterm-docker"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
futures-channel = "0.3"
futures-util = "0.3"
kube = { version = "5.1.0", default-features = false, features = ["client", "config", "rustls-tls", "ws", "http-proxy", "socks5"] }
pem = "4"
k8s-openapi = { version = "0.29.0", features = ["latest"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52", features = ["rt", "sync", "time", "io-util", "net", "fs", "macros"] }
tokio-util = { workspace = true, features = ["io"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
