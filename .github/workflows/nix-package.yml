name: Nix Package

on:
  workflow_dispatch:
  push:
    branches: [main, experiment/rust-native-v2]
    paths:
      - 'nix/**/*.nix'
      - 'flake.nix'
      - 'flake.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - '.github/workflows/nix-package.yml'
  pull_request:
    branches: [main, experiment/rust-native-v2]
    paths:
      - 'nix/**/*.nix'
      - 'flake.nix'
      - 'flake.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - '.github/workflows/nix-package.yml'

permissions:
  contents: read

concurrency:
  group: nix-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Nix package build
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build OxideTerm via Nix
        run: nix build .#oxideterm -L --show-trace

      - name: Check Nix flake
        run: nix flake check -L
