# Issue picker configuration — https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
blank_issues_enabled: false
contact_links:
  - name: Questions & support
    url: https://github.com/AnalyseDeCircuit/oxideterm/discussions/categories/q-a
    about: >
      For "how do I …?" questions, please use Discussions instead of opening an issue.
  - name: Security vulnerability
    url: https://github.com/AnalyseDeCircuit/OxideTerm/security/advisories/new
    about: >
      Report privately via GitHub — do not open a public issue for undisclosed vulnerabilities.
  - name: Latest release
    url: https://github.com/AnalyseDeCircuit/OxideTerm/releases/latest
    about: >
      Check your version before reporting — update to the latest release first.
      报告问题前请先检查版本，并更新到最新正式版。
  - name: Contributing & PR policy
    url: https://github.com/AnalyseDeCircuit/OxideTerm/blob/main/docs/CONTRIBUTING.md
    about: >
      Read CONTRIBUTING.md before proposing code changes or substantial implementation work.
